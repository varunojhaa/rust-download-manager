name: Build rdm

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

# Signing is fully optional: every step below is skipped when its secret is empty,
# so forks and unsigned builds keep working unchanged.
env:
  MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
  MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
  WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
  LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: windows-latest
            label: windows-x86_64
          - os: macos-14
            label: macos-arm64
          - os: macos-13
            label: macos-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-idm

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libwayland-dev pkg-config libssl-dev squashfs-tools

      - name: Build release binaries
        working-directory: rust-idm
        run: cargo build --release --bins

      - name: Run tests
        if: runner.os == 'Linux'
        working-directory: rust-idm
        run: cargo test --release

      - name: Install cargo-bundle
        continue-on-error: true
        run: cargo install cargo-bundle --locked

      - name: Package application
        continue-on-error: true
        working-directory: rust-idm
        run: cargo bundle --release --bin rdm-gui

      # ---------- macOS code signing + notarization ----------
      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERT_P12_BASE64 != ''
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign and notarize macOS app
        if: runner.os == 'macOS' && env.MACOS_SIGNING_IDENTITY != ''
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          shopt -s nullglob
          for app in rust-idm/target/release/bundle/osx/*.app; do
            codesign --force --deep --options runtime --timestamp \
              --sign "$MACOS_SIGNING_IDENTITY" "$app"
            codesign --verify --strict --verbose=2 "$app"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
              ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
              xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_PASSWORD" --wait
              xcrun stapler staple "$app"
            else
              echo "::notice::Signed but not notarized (APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD not set)."
            fi
          done

      # ---------- Windows Authenticode signing ----------
      - name: Sign Windows binaries and installer
        if: runner.os == 'Windows' && env.WINDOWS_CERT_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $ts = if ($env:WINDOWS_TIMESTAMP_URL) { $env:WINDOWS_TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          $targets = @()
          $targets += Get-ChildItem rust-idm/target/release/*.exe -ErrorAction SilentlyContinue
          if (Test-Path rust-idm/target/release/bundle) {
            $targets += Get-ChildItem rust-idm/target/release/bundle -Recurse -Include *.msi,*.exe
          }
          foreach ($t in $targets) {
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr $ts /td SHA256 $t.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($t.FullName)" }
          }
          Remove-Item $pfx -Force


      - name: Collect artifacts (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp rust-idm/target/release/rdm dist/ 2>/dev/null || true
          cp rust-idm/target/release/rdm-gui dist/ 2>/dev/null || true
          if [ -d rust-idm/target/release/bundle ]; then
            find rust-idm/target/release/bundle -maxdepth 2 -mindepth 1 -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' | while read -r f; do cp "$f" dist/; done
            if [ -d "rust-idm/target/release/bundle/osx" ]; then
              for app in rust-idm/target/release/bundle/osx/*.app; do
                [ -e "$app" ] || continue
                (cd "$(dirname "$app")" && zip -qry "$GITHUB_WORKSPACE/dist/$(basename "$app" .app)-${{ matrix.label }}.app.zip" "$(basename "$app")")
              done
            fi
          fi
          ls -la dist

      - name: Collect artifacts (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item rust-idm/target/release/rdm.exe dist/ -ErrorAction SilentlyContinue
          Copy-Item rust-idm/target/release/rdm-gui.exe dist/ -ErrorAction SilentlyContinue
          if (Test-Path rust-idm/target/release/bundle) {
            Get-ChildItem -Path rust-idm/target/release/bundle -Recurse -Include *.msi,*.exe |
              ForEach-Object { Copy-Item $_.FullName dist/ -ErrorAction SilentlyContinue }
          }
          Get-ChildItem dist

      # ---------- Linux GPG detached signatures ----------
      - name: Sign Linux packages with GPG
        if: runner.os == 'Linux' && env.LINUX_GPG_PRIVATE_KEY != ''
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          echo "$LINUX_GPG_PRIVATE_KEY" | base64 --decode 2>/dev/null | gpg --batch --import \
            || echo "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
          KEY_ARG=""
          [ -n "$LINUX_GPG_KEY_ID" ] && KEY_ARG="--local-user $LINUX_GPG_KEY_ID"
          for f in dist/*; do
            [ -f "$f" ] || continue
            case "$f" in *.asc|*.sha256) continue ;; esac
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$LINUX_GPG_PASSPHRASE" $KEY_ARG \
              --armor --detach-sign --output "$f.asc" "$f"
            gpg --verify "$f.asc" "$f"
          done
          gpg --armor --export ${LINUX_GPG_KEY_ID:-} > dist/rdm-signing-key.asc
          rm -rf "$GNUPGHOME"

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum * > SHA256SUMS.txt
          else
            shasum -a 256 * > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt


      - uses: actions/upload-artifact@v4
        with:
          name: rdm-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
