[package]
name = "rdm"
version = "0.1.0"
edition = "2021"
description = "rdm - a fast, resumable, multi-connection download manager (IDM alternative) written in Rust"
license = "MIT"

[lib]
name = "rdm"
path = "src/lib.rs"

[[bin]]
name = "rdm"
path = "src/main.rs"

[[bin]]
name = "rdm-gui"
path = "src/bin/rdm-gui.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe"]

[dependencies]
anyhow = "1"
chrono = "0.4"
dirs = "5"
eframe = { version = "0.28", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"], optional = true }
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
futures = "0.3"
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal"] }
url = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.bundle]
name = "rdm"
identifier = "dev.lovable.rdm"
icon = ["icons/icon_512x512.png"]
version = "0.1.0"
copyright = "Copyright (c) 2026"
category = "Utility"
short_description = "Fast, resumable, multi-connection download manager"
long_description = "rdm is a fast, resumable, multi-connection download manager with queues, scheduling, categories, browser integration and an egui desktop interface."
linux_mime_types = ["application/x-bittorrent"]
linux_exec = "%f"
osx_minimum_system_version = "10.11"
