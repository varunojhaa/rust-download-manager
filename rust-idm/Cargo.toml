[package]
name = "rdm"
version = "0.1.0"
edition = "2021"
description = "rdm - a fast, resumable, multi-connection download manager (IDM alternative) written in Rust"
license = "MIT"

[[bin]]
name = "rdm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.11", default-features = false, features = ["fuzzy-select"] }
futures = "0.3"
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal"] }
url = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
